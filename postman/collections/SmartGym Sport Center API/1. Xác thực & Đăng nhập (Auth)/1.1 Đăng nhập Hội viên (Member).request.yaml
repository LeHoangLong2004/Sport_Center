$kind: http-request
description: Đăng nhập tài khoản Hội viên (Ho Xuan Anh Nam). Chạy request này xong sẽ tự động lưu token cho các request bên dưới.
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "hoxuananhnam@gmail.com",
      "password": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.token) {
          pm.environment.set('token', jsonData.token);
          console.log('✅ Đã tự động lưu Token Hội viên vào biến {{token}}');
      }
    language: text/javascript
order: 1000
