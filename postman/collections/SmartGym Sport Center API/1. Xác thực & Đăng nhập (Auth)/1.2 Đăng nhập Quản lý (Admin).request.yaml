$kind: http-request
description: Đăng nhập quyền Admin / Quản lý để xem báo cáo doanh thu.
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "manager@test.com",
      "password": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.token) {
          pm.environment.set('token', jsonData.token);
          console.log('✅ Đã tự động lưu Token Admin vào biến {{token}}');
      }
    language: text/javascript
order: 2000
